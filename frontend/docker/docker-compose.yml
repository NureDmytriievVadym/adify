services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/frontend/node_modules
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
