services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    environment:
      PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    develop:
      watch:
        # Source is copied into the image; Compose Watch mirrors edits into the
        # container, so no host directory is mounted and UIDs need not match.
        - action: sync
          path: ../../frontend
          target: /app/frontend
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
            - test-results/
            - playwright-report/
            - docker/
            - package.json
        # Dependency and tooling changes invalidate the image, not only the source.
        - action: rebuild
          path: ../../frontend/package.json
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../package-lock.json

  e2e:
    profiles: ['e2e']
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile.e2e
    init: true
