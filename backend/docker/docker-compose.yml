services:
  backend:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    environment:
      ADIFY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adify}:${POSTGRES_PASSWORD:-adify-local-only}@postgres:5432/${POSTGRES_DB:-adify}
      ADIFY_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '.venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    develop:
      watch:
        # Python sources are synced into the image; uvicorn reloads them itself.
        - action: sync
          path: ../../backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - storage/
            - migrations/
            - alembic.ini
            - pyproject.toml
            - uv.lock
        # A new migration must be applied: restart runs `alembic upgrade head` again.
        - action: sync+restart
          path: ../../backend/migrations
          target: /app/migrations
        - action: sync+restart
          path: ../../backend/alembic.ini
          target: /app/alembic.ini
        - action: rebuild
          path: ../../backend/pyproject.toml
        - action: rebuild
          path: ../../backend/uv.lock
    volumes:
      # Runtime data, not source. Named volumes are unaffected by host file ownership.
      - uploads_data:/app/storage

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adify}
      POSTGRES_USER: ${POSTGRES_USER:-adify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adify-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-bookworm
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
  postgres_data:
  redis_data:
