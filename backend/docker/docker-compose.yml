services:
  backend:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    environment:
      ADIFY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adify}:${POSTGRES_PASSWORD:-adify-local-only}@postgres:5432/${POSTGRES_DB:-adify}
      ADIFY_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
      ADIFY_WEB_BASE_URL: http://localhost:${WEB_PORT:-5173}
      # Mailpit catches every email and dev SMS; set these in .env to send through Gmail.
      ADIFY_SMTP_HOST: ${ADIFY_SMTP_HOST:-mailpit}
      ADIFY_SMTP_PORT: ${ADIFY_SMTP_PORT:-1025}
      ADIFY_SMTP_STARTTLS: ${ADIFY_SMTP_STARTTLS:-false}
      ADIFY_SMTP_USERNAME: ${ADIFY_SMTP_USERNAME:-}
      ADIFY_SMTP_PASSWORD: ${ADIFY_SMTP_PASSWORD:-}
      ADIFY_MAIL_FROM: ${ADIFY_MAIL_FROM:-Adify <no-reply@adify.local>}
      # Payments go to the local Mono mock, which calls the webhook on the Compose network.
      # To try real Mono, set the three values in .env (see .env.example).
      ADIFY_MONO_TOKEN: ${ADIFY_MONO_TOKEN:-mono-mock}
      ADIFY_MONO_API_URL: ${ADIFY_MONO_API_URL:-http://mono-mock:8000}
      # No colon: an explicitly empty value in .env sends no webhook URL at all.
      ADIFY_API_PUBLIC_URL: ${ADIFY_API_PUBLIC_URL-http://backend:8000}
      # FR-041: set ADIFY_CLAMAV_HOST=clamav with `--profile malware` to scan evidence
      # with ClamAV. An empty host uses the built-in EICAR check only.
      ADIFY_CLAMAV_HOST: ${ADIFY_CLAMAV_HOST:-}
      ADIFY_CLAMAV_PORT: ${ADIFY_CLAMAV_PORT:-3310}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      mono-mock:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '.venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    develop:
      watch:
        # Python sources are synced into the image; uvicorn reloads them itself.
        - action: sync
          path: ../../backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - storage/
            - migrations/
            - alembic.ini
            - pyproject.toml
            - uv.lock
        # A new migration must be applied: restart runs `alembic upgrade head` again.
        - action: sync+restart
          path: ../../backend/migrations
          target: /app/migrations
        - action: sync+restart
          path: ../../backend/alembic.ini
          target: /app/alembic.ini
        - action: rebuild
          path: ../../backend/pyproject.toml
        - action: rebuild
          path: ../../backend/uv.lock
    volumes:
      # Runtime data, not source. Named volumes are unaffected by host file ownership.
      - uploads_data:/app/storage

  # Development stand-in for Mono acquiring (ADY-020): pay with any Luhn-valid card number.
  mono-mock:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    command: ['uvicorn', 'adify_api.dev.mono_mock:app', '--host', '0.0.0.0', '--port', '8000']
    ports:
      - '127.0.0.1:${MONO_MOCK_PORT:-8095}:8000'
    environment:
      # Its payment page opens in the browser, so links use the host port.
      MONO_MOCK_PUBLIC_URL: http://localhost:${MONO_MOCK_PORT:-8095}
    init: true
    healthcheck:
      test:
        [
          'CMD',
          '.venv/bin/python',
          '-c',
          "import socket; socket.create_connection(('localhost', 8000), 2)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: ../../backend/src/adify_api/dev
          target: /app/src/adify_api/dev

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adify}
      POSTGRES_USER: ${POSTGRES_USER:-adify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adify-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

  redis:
    image: redis:8-bookworm
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional FR-041 malware scanner. Start it only when needed:
  #   ADIFY_CLAMAV_HOST=clamav docker compose --profile malware up
  clamav:
    image: clamav/clamav:stable
    profiles: ['malware']
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  uploads_data:
  postgres_data:
  redis_data:
  clamav_data:
