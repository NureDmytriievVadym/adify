[project]
name = "adify-api"
version = "0.1.0"
description = "Adify's shared REST API for the web and native Android clients"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adify_api"]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
