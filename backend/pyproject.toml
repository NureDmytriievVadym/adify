[project]
name = "adify-api"
version = "0.1.0"
description = "Adify's shared REST API for the web and native Android clients"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "bcrypt>=4.2,<6.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adify_api"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
